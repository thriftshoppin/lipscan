<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #rec { display: none; background: #d0021b; color: #fff; font-weight: 700; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
  #state { margin-bottom: 10px; }
  label { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  button { width: 100%; margin-top: 6px; padding: 5px; }
  #msg { margin-top: 8px; color: #555; min-height: 1em; }
</style>
</head>
<body>
  <h1>LipScan</h1>
  <div id="rec">● RECORDING <button id="stop">Stop recording</button></div>
  <div id="state">…</div>
  <label><input type="checkbox" id="enabled"> On (off = disconnect and stop any recording)</label>
  <button id="copy">Copy connection code</button>
  <button id="new">Make a new code</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
